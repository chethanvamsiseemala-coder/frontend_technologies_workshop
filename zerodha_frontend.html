  <section>
   <!-- Login Form Section -->
<div class="login-section">
    <center>
     
  <h2>Login Form</h2>
  
  <form action="/login-endpoint" method="POST" autocomplete="on">
    
    <!-- Username Field -->
    <div>
      <label for="username">Username:</label><br>
      <input 
        type="text" 
        id="username" 
        name="username" 
        placeholder="Enter username" 
        autofocus 
        required 
        minlength="3" 
        maxlength="20">
    </div>
    <br>

    <!-- Email Field -->
    <div>
      <label for="email">Email id:</label><br>
      <input 
        type="email" 
        id="email" 
        name="email" 
        placeholder="Enter email" 
        required>
    </div>
    <br>

    <!-- Password Field -->
    <div>
      <label for="password">Password:</label><br>
      <input 
        type="password" 
        id="password" 
        name="password" 
        placeholder="Enter password" 
        required 
        minlength="6">
    </div>
    
    <br>

    <!-- Submit Button -->
    <button type="submit">Login</button>
    </center>
  </form>
</div>
  </section>
